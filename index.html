<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechLED - La lumière connectée</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="logo.png" alt="TechLED Logo" class="logo">
    <nav id="userContainer">
      <button id="authBtn" class="btn-outline">Connexion / Inscription</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>La lumière connectée pour demain</h1>
      <p>Imaginez une lampe connectée à votre vie. Gérez l’allumage, l’intensité et la couleur depuis votre smartphone.</p>
      <button class="btn-primary" id="heroConnectBtn">Connecter ma lampe</button>
    </section>

    <section class="features">
      <h2>📍 Gérez toutes vos lampes sur un seul lieu</h2>
      <p>Centralisez la gestion de vos lampes via une interface unique.</p>
    </section>
  </main>

  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div class="modal-tabs">
        <button class="tab-btn active" id="loginTab">Connexion</button>
        <button class="tab-btn" id="signupTab">Inscription</button>
      </div>
      
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="loginPassword" required></div>
        <button type="submit" class="btn-auth">Se connecter</button>
      </form>

      <form id="signupForm" style="display:none;">
        <div class="form-group"><label>Email</label><input type="email" id="signupEmail" required></div>
        <div class="form-group"><label>Mot de passe</label><input type="password" id="signupPassword" required></div>
        <button type="submit" class="btn-auth">S'inscrire</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="javascript/auth.js"></script>
</body>
</html>
