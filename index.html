<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
    </style>
</head>
<body>
    <header>
        <img class="logo" src="logo.png">
        <form class="form">
            <p id="heading">Connexion</p>
            <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.106 7.222c0-2.967-2.249-5.032-5.482-5.032-3.35 0-5.646 2.318-5.646 5.702 0 3.493 2.235 5.708 5.762 5.708.862 0 1.689-.123 2.304-.335v-.862c-.43.199-1.354.328-2.29.328-2.926 0-4.813-1.88-4.813-4.798 0-2.844 1.921-4.881 4.594-4.881 2.735 0 4.608 1.688 4.608 4.156 0 1.682-.554 2.769-1.416 2.769-.492 0-.772-.28-.772-.76V5.206H8.923v.834h-.11c-.266-.595-.881-.964-1.6-.964-1.4 0-2.378 1.162-2.378 2.823 0 1.737.957 2.906 2.379 2.906.8 0 1.415-.39 1.709-1.087h.11c.081.67.703 1.148 1.503 1.148 1.572 0 2.57-1.415 2.57-3.643zm-7.177.704c0-1.197.54-1.907 1.456-1.907.93 0 1.524.738 1.524 1.907S8.308 9.84 7.371 9.84c-.895 0-1.442-.725-1.442-1.914z"></path>
            </svg>
              <input autocomplete="off" placeholder="Nom d'utilisateur" class="input-field" type="text">
            </div>
            <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
            </svg>
              <input placeholder="Mot de passe" class="input-field" type="password">
            </div>
            <div class="btn">
            <button class="button1">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Connexion&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</button>
            <button class="button2">Inscription</button>
            </div>
            <button class="button3" type="submit" formaction="Forgot pass.html">Mot de passe oublié ?</button>
        </form>
        
    </header>

<script>
  const usernameInput = document.querySelectorAll('.input-field')[0];
  const passwordInput = document.querySelectorAll('.input-field')[1];
  const loginButton = document.querySelector('.button1');
  const signupButton = document.querySelector('.button2');

  // Connexion
  loginButton.addEventListener('click', function (event) {
    event.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    const storedPassword = localStorage.getItem(username);

    if (storedPassword && storedPassword === password) {
      sessionStorage.setItem('authenticated', 'true');
      alert('Connexion réussie !');
      window.location.href = 'dashboard.html'; // à adapter si besoin
    } else {
      alert('Nom d\'utilisateur ou mot de passe incorrect');
    }
  });

  // Inscription
  signupButton.addEventListener('click', function (event) {
    event.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      alert('Veuillez remplir les deux champs.');
      return;
    }

    if (localStorage.getItem(username)) {
      alert('Ce nom d\'utilisateur est déjà utilisé.');
    } else {
      localStorage.setItem(username, password);
      alert('Compte créé avec succès ! Vous pouvez maintenant vous connecter.');
      usernameInput.value = '';
      passwordInput.value = '';
    }
  });
</script>
</body>
</html>
