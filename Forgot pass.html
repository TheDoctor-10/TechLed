<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Réinitialisation du mot de passe</title>
<link rel="stylesheet" href="css/Forgot pass.css" />
</head>
<body>
  <header>
    <img class="logo" src="logo.png" alt="Logo" />
    <form class="form" id="resetForm" onsubmit="return false;">
      <p id="heading">Mot de passe oublié</p>

      <div class="field">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M13.106 7.222c0-2.967-2.249-5.032-5.482-5.032-3.35 0-5.646 2.318-5.646 5.702 0 3.493 2.235 5.708 5.762 5.708.862 0 1.689-.123 2.304-.335v-.862c-.43.199-1.354.328-2.29.328-2.926 0-4.813-1.88-4.813-4.798 0-2.844 1.921-4.881 4.594-4.881 2.735 0 4.608 1.688 4.608 4.156 0 1.682-.554 2.769-1.416 2.769-.492 0-.772-.28-.772-.76V5.206H8.923v.834h-.11c-.266-.595-.881-.964-1.6-.964-1.4 0-2.378 1.162-2.378 2.823 0 1.737.957 2.906 2.379 2.906.8 0 1.415-.39 1.709-1.087h.11c.081.67.703 1.148 1.503 1.148 1.572 0 2.57-1.415 2.57-3.643zm-7.177.704c0-1.197.54-1.907 1.456-1.907.93 0 1.524.738 1.524 1.907S8.308 9.84 7.371 9.84c-.895 0-1.442-.725-1.442-1.914z"/>
        </svg>
        <input id="email" autocomplete="off" placeholder="Votre email" class="input-field" type="email" required />
      </div>

      <div class="btn">
        <button class="button1" id="resetBtn">Envoyer le lien</button>
      </div>

      <p id="message" style="text-align:center; margin-top:1em;"></p>
    </form>
  </header>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script>
    // Ta config Firebase ici (remplace par la tienne)
    const firebaseConfig = {
    apiKey: "AIzaSyCCvoXrrQLiH7rK-YH4Wa3K5xO7jg4UB5M",
    authDomain: "techled-1c800.firebaseapp.com",
    projectId: "techled-1c800",
    storageBucket: "techled-1c800.firebasestorage.app",
    messagingSenderId: "1016231820720",
    appId: "1:1016231820720:web:7453b90d3afa7ee811ea75",
    measurementId: "G-78P5BS8GPN"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const resetBtn = document.getElementById('resetBtn');
    const message = document.getElementById('message');

    resetBtn.addEventListener('click', () => {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        message.style.color = 'red';
        message.textContent = "Merci de saisir un email valide.";
        return;
      }
      auth.sendPasswordResetEmail(email)
        .then(() => {
          message.style.color = 'lightgreen';
          message.textContent = "Un email de réinitialisation a été envoyé.";
        })
        .catch((error) => {
          message.style.color = 'red';
          message.textContent = "Erreur : " + error.message;
        });
    });
  </script>
</body>
</html>
