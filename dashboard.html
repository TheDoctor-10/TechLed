<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechLED - Mon Compte</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header>
    <div class="logo">TechLED</div>
    <div id="userContainer"></div>
  </header>

  <main>
    <aside class="lamp-list">
      <h2>Toutes mes lampes</h2>
      <ul>
        <li>XV2OTOX12100 <span>12/05/2025</span></li>
        <li>XG90XFC47903 <span>12/05/2025</span></li>
        <li class="active">BI90CIP84400 <span>12/05/2025</span></li>
      </ul>
      <a href="#">Afficher plus</a>
    </aside>

    <section class="dashboard">
      <div class="card">
        <h3>Détecter une nouvelle lampe</h3>
        <div class="icons">
          <span>📶</span>
          <span>🔵</span>
          <span>✏️</span>
        </div>
      </div>
      <!-- Autres cards inchangées -->
    </section>
  </main>

  <div id="resetModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Réinitialiser le mot de passe</h2>
      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" required>
        </div>
        <button type="submit" class="btn-auth">Envoyer le mail</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="javascript/auth.js"></script>
</body>
</html>
